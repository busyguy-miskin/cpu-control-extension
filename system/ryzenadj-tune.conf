# ryzenadj 调优参数 (第 2 层: 降温 + 限流 + 限爆发)
#
# 这个文件被两个角色使用:
#   1. ryzenadj-tune.service (root 守护进程) — 每 INTERVAL 秒读 ARGS 并重新应用
#   2. cpuctrl helper 的 tune 命令 — 切换档位时会重写 ARGS 行
#
# 单位: 功率 mW / 电流 mA / 温度 °C
# (ryzenadj CLI 参数: 功率×1000, 电流×1000, 温度原值)
#
# 手动编辑后让它生效:
#   sudo systemctl restart ryzenadj-tune.service
#
# 默认 = 均衡档 (90°C / 85A / 45W)
ARGS="--tctl-temp=90 --vrmmax-current=85000 --fast-limit=45000"
INTERVAL=30
